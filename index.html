<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8f8f6" />
    <meta name="description" content="An animated bento board of production-ready UI components." />
    <title>Satin UI</title>
    <script>
      /* Apply the saved theme and corner style before first paint. */
      try {
        var root = document.documentElement;
        if (localStorage.getItem("bento:theme") === "dark") root.classList.add("dark");
        root.dataset.shape = localStorage.getItem("bento:shape") || "round";
        root.dataset.accent = localStorage.getItem("bento:accent") || "green";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
